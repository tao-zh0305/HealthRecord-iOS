name: HealthRecord

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  HealthRecord:
    type: application
    platform: iOS
    sources:
      - path: HealthApp
    entitlements:
      path: HealthApp/HealthRecord.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: HealthApp/Info.plist
      properties:
        CFBundleDisplayName: 健康记录
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.local.healthrecord
            CFBundleURLSchemes:
              - healthrecord
        NSHealthShareUsageDescription: 读取你的步数、睡眠、心率、体重和血压，用于生成趋势记录。数据仅保存在本机。
        NSHealthUpdateUsageDescription: 本 App 不会写入健康数据。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.healthrecord
        PRODUCT_NAME: HealthRecord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
